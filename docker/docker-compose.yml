services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      RAW_PDF_DIR: /app/dataset/raw_pdf
      VECTOR_STORE_DIR: /app/dataset/vector_store
      HF_HOME: /models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ../dataset:/app/dataset
      - model-cache:/models/huggingface

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  model-cache:
